name: Validate gaming runtime
on:
  push:
    paths:
      - 'gaming-os/**'
      - '.github/workflows/gaming-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check authentication and container configuration
        run: python3 -m unittest discover -s gaming-os -p 'test_*.py' -v
      - name: Validate secure deployment shell syntax
        run: bash -n gaming-os/secure-start.sh gaming-os/host-check.sh gaming-os/game-session.sh
      - name: Validate secure Compose overlays
        env:
          EXE_DECK_DOMAIN: example.com
          EXE_DECK_ACME_EMAIL: test@example.com
          EXE_DECK_GITHUB_CLIENT_ID: test-id
          EXE_DECK_GITHUB_CLIENT_SECRET: test-secret
          EXE_DECK_COOKIE_SECRET: abcdefghijklmnopqrstuvwxyz0123456789abcdef
          EXE_DECK_GITHUB_ALLOWED_USERS: example-user
        run: |
          docker compose -f gaming-os/compose.yaml -f gaming-os/compose.remote.yaml -f gaming-os/compose.github.yaml -f gaming-os/compose.github.caddy.yaml -f gaming-os/compose.isolated.yaml config --quiet
      - name: Build Linux compatibility container
        run: docker build -t exe-deck-gaming:ci gaming-os
      - name: Verify Wine is installed
        run: docker run --rm exe-deck-gaming:ci wine --version
      - name: Verify Vulkan diagnostics are installed
        run: docker run --rm exe-deck-gaming:ci bash -lc 'command -v vulkaninfo && command -v winetricks'
      - name: Smoke test graphical desktop and browser endpoint
        run: |
          docker run -d --name exe-deck-smoke exe-deck-gaming:ci
          trap 'docker logs exe-deck-smoke; docker rm -f exe-deck-smoke' EXIT
          for i in $(seq 1 30); do
            if docker exec exe-deck-smoke bash -lc 'curl --fail --silent http://127.0.0.1:6080/vnc.html >/dev/null && pgrep -x openbox >/dev/null && pgrep -x Xvfb >/dev/null'; then
              echo "Desktop and noVNC endpoint are responding"
              exit 0
            fi
            sleep 2
          done
          echo "Graphical session did not become ready" >&2
          exit 1
